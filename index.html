<script>
  function showBootError(msg) {
    var box = document.getElementById('boot-error');
    var detail = document.getElementById('boot-error-detail');
    if (box && detail) {
      detail.textContent = msg;
      box.style.display = 'block';
    }
  }
  window.addEventListener('error', function (e) {
    showBootError((e && e.message) || String(e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Promise rejeitada: ' + ((e && e.reason && e.reason.message) || String(e && e.reason)));
  });
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (typeof React === 'undefined') { showBootError('React não carregou (CDN unpkg.com/react pode estar bloqueado).'); return; }
      if (typeof ReactDOM === 'undefined') { showBootError('ReactDOM não carregou (CDN unpkg.com/react-dom pode estar bloqueado).'); return; }
      if (typeof XLSX === 'undefined') { showBootError('XLSX não carregou (CDN cdn.sheetjs.com pode estar bloqueado).'); return; }
      if (document.getElementById('root') && document.getElementById('root').childElementCount === 0) {
        showBootError('As bibliotecas carregaram, mas a ferramenta não desenhou nada na tela. Avise quem está ajustando a ferramenta.');
      }
    }, 4000);
  });
</script>

  }));
}

// Lê as linhas de uma aba sempre a partir da célula A1 (por padrão o SheetJS
// começa na primeira célula usada, o que deslocaria linha e coluna). Assim o
// índice de cada linha/coluna bate com a posição real no Excel e dá pra
// mostrar onde cada bloco fica. "anchored" diz se dá pra confiar nisso.
function applyHiddenCellsFilter(rows, sheet) {
  // Colunas e linhas ocultas no Excel (inclui linhas escondidas por filtro e
  // grupos recolhidos) são esvaziadas ANTES da leitura dos blocos — assim um
  // bloco oculto na matriz (ex.: EMP PURPLE - N1) também some da automação,
  // sem precisar listar nome por nome.
  const colsMeta = sheet['!cols'] || [];
  const rowsMeta = sheet['!rows'] || [];
  const hiddenCols = [];
  colsMeta.forEach((m, c) => {
    if (m && (m.hidden || m.wpx === 0 || m.wch === 0 || m.width === 0)) hiddenCols.push(c);
  });
  for (let r = 0; r < rows.length; r++) {
    const m = rowsMeta[r];
    if (m && m.hidden) { rows[r] = []; continue; }
    const row = rows[r];
    if (!row) continue;
    for (const c of hiddenCols) {
      if (c < row.length) row[c] = '';
    }
  }
  return rows;
}
function readSheetRows(XLSXlib, sheet) {
  const ref = sheet && sheet['!ref'];
  if (!ref) return { rows: [], anchored: true };
  const baseOpts = { header: 1, raw: false, defval: '' };
  try {
    const end = XLSXlib.utils.decode_range(ref).e;
    const rows = XLSXlib.utils.sheet_to_json(sheet, { ...baseOpts, range: 'A1:' + XLSXlib.utils.encode_cell(end) });
    const anchored = rows.length === end.r + 1;
    // só dá pra confiar nos índices de coluna/linha quando a leitura partiu do A1
    if (anchored) applyHiddenCellsFilter(rows, sheet);
    return { rows, anchored };
  } catch (err) {
    return { rows: XLSXlib.utils.sheet_to_json(sheet, baseOpts), anchored: false };
  }
}

// Núcleo da leitura da planilha, separado da tela pra poder ser testado de
// verdade. getSheetRows(nomeDaAba) devolve { rows, anchored }.
function buildMatrixFromWorkbook(sheetNames, getSheetRows) {
  const campaigns = {};
  const order = [];
  const summaries = [];
  let totalExcluded = 0;
  let hiddenSheetCount = 0;

  for (const sheetName of sheetNames) {
    // abas descontinuadas (nome com "OLD", ou substituídas por uma
    // versão com outro nome, tipo "... - NOVA") não entram em nada —
    // nem leitura, nem busca, nem painel de blocos
    if (/OLD/i.test(sheetName) || HIDDEN_SHEET_NAMES.includes(sheetName)) {
      hiddenSheetCount += 1;
      continue;
    }
    const { rows: sheetRows, anchored } = getSheetRows(sheetName);
    const parsed = parseMatrix(sheetRows);
    if (!anchored) {
      // não deu pra garantir a posição das células: o painel mostra o
      // bloco do mesmo jeito, só sem o "AD1:AF16"
      for (const list of Object.values(parsed.blocks)) {
        for (const b of list) b.col = -1;
      }
    }
    // troca o nome de exibição pras campanhas que precisam do aviso
    // "- OLD" antes de mais nada usar esses dados, pra tudo daqui pra
    // frente (painel de blocos, busca, resultado) já enxergar o nome
    // final
    const renamed = applyDisplayNameOverrides(
      sheetName,
      parsed.campaigns,
      parsed.order,
      parsed.collapsedCounts,
      parsed.keptBothSkills,
      parsed.blocks
    );
    // aplica a lista de exclusões conhecidas antes de mais nada usar
    // esses dados — assim o painel de blocos e o resultado final
    // já saem sem essas entradas, não importa a cópia da planilha
    const { cleaned: cleanedCampaigns, excludedCount } = applyKnownExclusions(renamed.campaigns);
    totalExcluded += excludedCount;
    const sheetOrder = renamed.order.filter((name) => cleanedCampaigns[name].length > 0);

    if (sheetOrder.length === 0) continue;

    summaries.push({
      sheetName,
      campaignNames: sheetOrder,
      campaigns: cleanedCampaigns,
      collapsedCounts: renamed.collapsedCounts,
      keptBothSkills: renamed.keptBothSkills,
    });

    for (const name of sheetOrder) {
      // cada aba mantém sua própria versão da campanha — nome repetido
      // em outra aba (ex.: "RETENÇÃO PME" no Huawei, no PME MÓVEL e no
      // rascunho "leandro") vira uma entrada nova, não um merge com o
      // que já foi lido; dentro da MESMA aba, se o nome já apareceu em
      // outra lane, aí sim continua somando (era o comportamento
      // original e faz sentido pra blocos repetidos lado a lado)
      const key = campaignKey(sheetName, name);
      if (!campaigns[key]) {
        campaigns[key] = [];
        order.push({
          key,
          name,
          sheetName,
          collapsedCount: renamed.collapsedCounts[name] || 0,
          keptBothCount: renamed.keptBothSkills[name] ? renamed.keptBothSkills[name].size : 0,
          // blocos crus da matriz (sem os vazios) pro painel "matriz de origem"
          blocks: (renamed.blocks[name] || []).filter((b) => b.rows.length > 0),
        });
      }
      for (const item of cleanedCampaigns[name]) {
        if (NO_DEDUP_CAMPAIGNS.includes(name) || !campaigns[key].some((s) => s.skill === item.skill && s.prof === item.prof)) {
          campaigns[key].push(item);
        }
      }
    }
  }

  for (const mc of MANUAL_CAMPAIGNS) {
    if (order.some((o) => o.sheetName === mc.sheetName && normalize(o.name) === normalize(mc.name))) continue;
    const key = campaignKey(mc.sheetName, mc.name);
    campaigns[key] = mc.skills.map((s) => ({ skill: s.skill, prof: s.pri === '-' || s.pri === '' ? '3' : s.pri }));
    order.push({
      key,
      name: mc.name,
      sheetName: mc.sheetName,
      collapsedCount: 0,
      keptBothCount: 0,
      blocks: [{ col: -1, titleRow: 1, lastRow: mc.skills.length + 1, rows: mc.skills.map((s) => ({ skill: s.skill, nome: s.nome, pri: s.pri })) }],
    });
    summaries.push({ sheetName: mc.sheetName + ' (adicionada manualmente)', campaignNames: [mc.name], campaigns: { [mc.name]: campaigns[key] }, collapsedCounts: {}, keptBothSkills: {} });
  }

  const totalSkills = order.reduce((sum, c) => sum + campaigns[c.key].length, 0);

  // mapeia nome -> abas onde ele aparece, guardando só os que repetem;
  // é exatamente o cenário que causava a mistura (ex.: "RETENÇÃO PME"
  // em 3 abas diferentes) — mostrar isso de cara ajuda a perceber
  // rascunho/aba antiga esquecida na planilha antes de gerar qualquer coisa
  const nameSheets = {};
  for (const o of order) {
    if (!nameSheets[o.name]) nameSheets[o.name] = [];
    nameSheets[o.name].push(o.sheetName);
  }
  const dupes = {};
  for (const [name, sheets] of Object.entries(nameSheets)) {
    if (sheets.length > 1) dupes[name] = sheets;
  }

  return { campaigns, order, summaries, dupes, totalSkills, totalExcluded, hiddenSheetCount };
}

// ---------- arquivo com os logins ----------
// O analista recebe um arquivo (.xlsx, .xls, .csv ou .txt) com os logins. Em vez
// de copiar um por um, ele solta o arquivo no bloco do passo 2 e a ferramenta
// acha sozinha a coluna certa: primeiro procura um cabeçalho tipo "Login"; se
// não achar, usa a coluna cujas células mais parecem login (uma palavra curta,
// sem espaço, de preferência com número).
const LOGIN_HEADER_RE = /login|usuario|matricula|\buser\b/;
const HEADER_WORD_RE = /^(logins?|usuarios?|user|users|matriculas?|nome|name|id|re)$/;
const NOT_A_LOGIN_RE = /^(logins?|usuarios?|user|users|matriculas?|nome|name)$/;
function headerPriority(cell) {
  if (/login/.test(cell)) return 0;
  if (/usuario|\buser\b/.test(cell)) return 1;
  return 2;
}
function looksLikeLogin(s) {
  return /^[A-Za-z0-9][A-Za-z0-9._@\-]{1,39}$/.test(s);
}
function extractLoginsFromRows(rawRows) {
  let rows = rawRows.map((r) => (r || []).map((c) => (c == null ? '' : String(c)).trim()));
  // uma única linha com vários valores (ex.: "ab12, cd34, ef56") é uma lista na horizontal
  const filled = rows.filter((r) => r.some((c) => c));
  if (filled.length === 1 && filled[0].filter((c) => c).length >= 2) rows = filled[0].filter((c) => c).map((c) => [c]);
  const maxCol = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const candidates = [];
  // 1) colunas com cabeçalho "Login", "Usuário", "Matrícula"... (nas 15 primeiras linhas)
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    for (let c = 0; c < maxCol; c++) {
      const cell = normalize(rows[r][c] || '');
      if (cell && cell.length <= 40 && LOGIN_HEADER_RE.test(cell)) {
        candidates.push({ col: c, startRow: r + 1, how: 'coluna "' + rows[r][c] + '"', pri: headerPriority(cell), r, c });
      }
    }
  }
  candidates.sort((a, b) => a.pri - b.pri || a.r - b.r || a.c - b.c);
  // 2) sem cabeçalho (ou cabeçalho sem nada embaixo): as colunas com mais cara de login
  const scored = [];
  for (let c = 0; c < maxCol; c++) {
    let withDigit = 0;
    let plain = 0;
    for (const row of rows) {
      const v = row[c] || '';
      if (looksLikeLogin(v)) {
        plain++;
        if (/\d/.test(v)) withDigit++;
      }
    }
    if (plain > 0) scored.push({ c, withDigit, plain });
  }
  scored.sort((a, b) => b.withDigit - a.withDigit || b.plain - a.plain || a.c - b.c);
  for (const s of scored) {
    const first = rows.length ? rows[0][s.c] || '' : '';
    candidates.push({ col: s.c, startRow: HEADER_WORD_RE.test(normalize(first)) ? 1 : 0, how: 'coluna ' + colLetter(s.c) });
  }
  for (const cand of candidates) {
    const list = [];
    for (let r = cand.startRow; r < rows.length; r++) {
      const v = rows[r][cand.col] || '';
      if (v && !NOT_A_LOGIN_RE.test(normalize(v))) list.push(v);
    }
    if (list.length > 0) return { logins: [...new Set(list)], how: cand.how };
  }
  return { logins: [], how: '' };
}
async function readLoginsFile(XLSXlib, file) {
  const name = (file.name || '').toLowerCase();
  if (/\.(txt|csv|tsv)$/.test(name) || (file.type || '').indexOf('text/') === 0) {
    const text = await file.text();
    return extractLoginsFromRows(text.split(/\r?\n/).map((line) => line.split(/[\t;,]/)));
  }
  const buf = await file.arrayBuffer();
  const wb = XLSXlib.read(buf, { type: 'array' });
  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName];
    if (!sheet) continue;
    const rows = XLSXlib.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    const res = extractLoginsFromRows(rows);
    if (res.logins.length > 0) return { ...res, sheetName: wb.SheetNames.length > 1 ? sheetName : '' };
  }
  return { logins: [], how: '' };
}

// ---------- print da aprovação ----------
// Lê a imagem colada/enviada, reduz (largura máx. 1920px) e converte para JPEG
// para o pedido caber folgado no envio ao Apps Script.
function getImageFromClipboard(cd) {
  if (!cd) return null;
  const items = cd.items ? Array.from(cd.items) : [];
  for (const it of items) {
    if (it.kind === 'file' && /^image\//.test(it.type || '')) {
      const f = it.getAsFile();
      if (f) return f;
    }
  }
  if (cd.files && cd.files.length > 0) {
    for (const f of Array.from(cd.files)) if (/^image\//.test(f.type || '')) return f;
  }
  return null;
}
function readImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type || '')) {
      reject(new Error('Esse arquivo não é uma imagem. Use PNG ou JPG, ou cole o print com Ctrl+V.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler a imagem.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Não consegui abrir essa imagem.'));
      img.onload = () => {
        const scale = Math.min(1, 1920 / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.85;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length > 1800000 && q > 0.5) {
          q -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', q);
        }
        resolve({ dataUrl, w, h, kb: Math.round((dataUrl.length * 0.75) / 1024) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Arquivos aceitos no card "Aprovação": imagem (reduzida a JPEG) ou documento de até 3 MB.
const APPROVAL_MAX_FILES = 6;
const APPROVAL_MAX_DOC_BYTES = 3 * 1024 * 1024;
const APPROVAL_MAX_TOTAL_BYTES = 8 * 1024 * 1024;
const APPROVAL_EXT = ['pdf', 'eml', 'msg', 'txt', 'csv', 'doc', 'docx', 'xls', 'xlsx'];
const APPROVAL_ACCEPT = 'image/*,.pdf,.eml,.msg,.txt,.csv,.doc,.docx,.xls,.xlsx';
function getFilesFromClipboard(cd) {
  if (!cd) return [];
  const out = [];
  const items = cd.items ? Array.from(cd.items) : [];
  for (const it of items) {
    if (it.kind === 'file') {
      const f = it.getAsFile();
      if (f) out.push(f);
    }
  }
  if (out.length === 0 && cd.files && cd.files.length > 0) return Array.from(cd.files);
  return out;
}
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler "' + (file.name || 'arquivo') + '".'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
async function readApprovalFile(file) {
  if (/^image\//.test(file.type || '')) {
    const r = await readImageFile(file);
    return { kind: 'img', dataUrl: r.dataUrl, w: r.w, h: r.h, kb: r.kb, bytes: Math.round(r.dataUrl.length * 0.75) };
  }
  const m = /\.([A-Za-z0-9]+)$/.exec(file.name || '');
  const ext = m ? m[1].toLowerCase() : '';
  if (APPROVAL_EXT.indexOf(ext) < 0) {
    throw new Error('"' + (file.name || 'arquivo') + '": tipo não aceito. Use imagem, PDF, e-mail (.eml/.msg), Word, Excel ou texto.');
  }
  if (file.size > APPROVAL_MAX_DOC_BYTES) {
    throw new Error('"' + file.name + '" passa de ' + Math.round(APPROVAL_MAX_DOC_BYTES / 1048576) + ' MB.');
  }
  const dataUrl = await readFileAsDataUrl(file);
  return { kind: 'file', dataUrl, w: 0, h: 0, kb: Math.max(1, Math.round(file.size / 1024)), bytes: file.size };
}

// A leitura roda no navegador com o Tesseract.js (baixado na primeira vez que precisar; depois fica guardado).

  // palavras de uma linha com a posição: { u: MAIÚSCULA, s: como está escrita, a: início, b: fim }
  function palavrasPos(sa) {
