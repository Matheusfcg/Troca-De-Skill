{padding-left:.75rem}.pl-9{padding-left:2.25rem}.pr-3{padding-right:.75rem}.text-left{text-align:left}.text-center{text-align:center}.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,Courier New,monospace}.text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}.text-base{font-size:1rem;line-height:1.5rem}.text-sm{font-size:.875rem;line-height:1.25rem}.text-xs{font-size:.75rem;line-height:1rem}.font-bold{font-weight:700}.font-medium{font-weight:500}.font-semibold{font-weight:600}.uppercase{text-transform:uppercase}.tracking-wide{letter-spacing:.025em}.text-white{--tw-text-opacity:1;color:rgb(255 255 255/var(--tw-text-opacity,1))}.underline{text-decoration-line:underline}.opacity-40{opacity:.4}.opacity-50{opacity:.5}.filter{filter:var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow)}.transition-opacity{transition-property:opacity;transition-timing-function:cubic-bezier(.4,0,.2,1);transition-duration:.15s}.last\:border-0:last-child{border-width:0}.disabled\:cursor-not-allowed:disabled{cursor:not-allowed}@media (min-width:640px){.sm\:w-56{width:14rem}.sm\:w-72{width:18rem}.sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.sm\:flex-row{flex-direction:row}}

<style id="ct-design">
/* Visual do build 41 ("área de trabalho"): faixa vermelha Claro com o título, passos em cartões à esquerda e o
   painel "Resumo da troca" fixo à direita, com a conferência e os botões de validar e baixar. Cores em variáveis no :root. */
:root{
  --claro:#DA291C;--claro-h:#C2241A;--claro-a:#A81E15;--claro-t:#B4231A;--claro-50:#FDF3F2;--claro-100:#F8D9D6;--claro-ring:rgba(218,41,28,.16);
  --ink:#1B1F24;--ink-2:#3D4450;--ink-3:#5F6773;--ink-4:#8A919C;--ink-5:#AEB4BD;
  --line:#E3E6EA;--line-2:#EDEFF2;--line-3:#CDD2D9;
  --bg:#F3F4F6;--surface:#FFFFFF;--surface-2:#F8F9FA;--surface-3:#F1F3F5;
  --ok:#1E8E5A;--ok-t:#17663F;--ok-bg:#EDF8F1;--ok-line:#C9E8D5;
  --warn:#C77700;--warn-t:#7A4100;--warn-bg:#FFF7EB;--warn-line:#F2DBAE;
  --err:#C8281C;--err-t:#A3170E;--err-bg:#FDF1F0;--err-line:#F2C9C4;
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --sh-panel:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.08);
  --sh-pop:0 12px 32px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
  --sh-modal:0 24px 64px rgba(16,24,40,.24);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--bg);color:var(--ink);font-family:var(--font)}
.font-mono{font-family:var(--mono)}
::selection{background:var(--claro-100)}

/* largura da página (topo, faixa e conteúdo alinhados) */
.ct-shell{max-width:82rem;margin-left:auto;margin-right:auto;padding-left:28px;padding-right:28px}

/* barra do topo */
.ct-top{background:var(--claro)}
.ct-top-in{display:flex;align-items:center;gap:16px;height:56px;border-bottom:1px solid rgba(255,255,255,.16)}
.ct-top-claro{height:26px;width:auto}
.ct-top-hitss{height:16px;width:auto;opacity:.95}
.ct-top-sep{width:1px;height:20px;background:rgba(255,255,255,.3);flex-shrink:0}
.ct-top-name{font-size:14px;font-weight:600;letter-spacing:.005em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* faixa vermelha com o título (o conteúdo sobe por cima dela) */
.ct-band{background:radial-gradient(900px 280px at 86% -30%,rgba(255,255,255,.13),rgba(255,255,255,0) 70%),linear-gradient(180deg,var(--claro) 0%,#C6231A 100%);color:#fff}
.ct-band-in{padding-top:26px;padding-bottom:96px}
.ct-h1{margin-top:10px;font-size:30px;line-height:38px;font-weight:700;letter-spacing:-.02em;color:#fff}
.ct-lead{margin-top:6px;max-width:46rem;font-size:14.5px;line-height:22px;color:rgba(255,255,255,.88)}

/* área de trabalho: passos à esquerda, painel à direita */
.ct-body{margin-top:-68px;padding-bottom:36px}
.ct-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.ct-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ct-aside{min-width:0}
@media (min-width:1180px){
  .ct-grid{grid-template-columns:minmax(0,1fr) 360px;gap:24px}
  .ct-aside{position:sticky;top:16px}
  .ct-panel{max-height:calc(100vh - 32px);overflow-y:auto}
}

/* cartões dos passos */
.ct-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);padding:0 24px 24px;scroll-margin-top:16px}
.ct-card-h{display:flex;align-items:flex-start;gap:14px;margin:0 -24px 4px;padding:18px 24px 16px;border-bottom:1px solid var(--line-2)}
.ct-card-n{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;transition:background-color .2s ease,color .2s ease}
.ct-card-n.on{background:var(--claro);color:#fff;box-shadow:0 2px 6px rgba(218,41,28,.28)}
.ct-card-n.off{background:var(--surface-3);color:var(--ink-4);box-shadow:inset 0 0 0 1px var(--line)}
.ct-card-ht{min-width:0;flex:1 1 auto;padding-top:1px}
.ct-card-t{font-size:16px;line-height:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.ct-card-d{margin-top:2px;font-size:13px;line-height:19px;color:var(--ink-3)}
.ct-card-x{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:3px}
.ct-card .text-xs{font-size:12.5px;line-height:18px}
.ct-card .text-\[11px\]{font-size:12px;line-height:16px}
.ct-help{font-size:12px;line-height:16px;color:var(--ink-3)}

/* etiquetas de status */
.ct-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ct-pill:before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor;flex-shrink:0}
.ct-pill-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-t)}
.ct-pill-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-t)}
.ct-pill-err{background:var(--err-bg);border-color:var(--err-line);color:var(--err-t)}
.ct-pill-claro{background:var(--claro-50);border-color:var(--claro-100);color:var(--claro-t)}
.ct-pill-mute{background:var(--surface-3);border-color:var(--line);color:var(--ink-3)}
.ct-pill-mute:before{display:none}

/* painel "Resumo da troca" */
.ct-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-panel)}
.ct-panel-h{padding:18px 20px 16px;border-bottom:1px solid var(--line-2)}
.ct-panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ct-kicker{font-size:11.5px;line-height:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4)}
.ct-panel-t{margin-top:10px;font-size:17px;line-height:24px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow-wrap:anywhere}
.ct-panel-t.vazio{color:var(--ink-4);font-weight:600;font-size:15px}
.ct-panel-s{margin-top:2px;font-size:12.5px;line-height:18px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line-2)}
.ct-stat{padding:14px 10px 13px 20px;border-right:1px solid var(--line-2);min-width:0}
.ct-stat:last-child{border-right:0}
.ct-stat-v{font-size:21px;line-height:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-stat-v.vazio{color:var(--ink-5)}
.ct-stat-l{margin-top:2px;font-size:12px;line-height:16px;color:var(--ink-3)}
.ct-panel-b{padding:16px 20px 18px}
.ct-panel-b+.ct-panel-b{border-top:1px solid var(--line-2)}
.ct-checks{margin-top:10px;display:flex;flex-direction:column}
.ct-chk{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.ct-chk-i{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.ct-chk.wait .ct-chk-i{animation:ct-rot 2.4s linear infinite}
.ct-chk-t{font-size:13.5px;line-height:20px;font-weight:600;color:var(--ink)}
.ct-chk-s{font-size:12.5px;line-height:18px;color:var(--ink-3);overflow-wrap:anywhere}
.ct-chk.off .ct-chk-t{color:var(--ink-3);font-weight:500}
.ct-chk.off .ct-chk-s{color:var(--ink-4)}
.ct-chk.warn .ct-chk-s,.ct-chk.wait .ct-chk-s{color:var(--warn-t)}
.ct-chk.err .ct-chk-s{color:var(--err-t)}
.ct-act{display:flex;flex-direction:column;gap:14px}
.ct-dl{padding-top:14px;border-top:1px dashed var(--line)}

/* campos */
.ct-label{display:block;font-size:13px;line-height:18px;font-weight:600;color:var(--ink-2)}
.ct-input{background:#fff;border:1px solid var(--line-3);color:var(--ink);outline:none;transition:border-color .15s ease,box-shadow .15s ease}
.ct-input:hover:not(:disabled):not(:focus){border-color:#B5BCC5}
.ct-input:focus{border-color:var(--claro);box-shadow:0 0 0 3px var(--claro-ring)}
.ct-input:disabled{background:var(--surface-2);color:var(--ink-4)}
.ct-input::placeholder,.ct-composer-text::placeholder{color:var(--ink-4)}
select.ct-input{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235F6773' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px;cursor:pointer}

/* botões */
.ct-btn-primary{background:var(--claro);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.14);transition:background-color .15s ease,box-shadow .15s ease}
.ct-btn-primary:hover:not(:disabled){background:var(--claro-h)}
.ct-btn-primary:active:not(:disabled){background:var(--claro-a)}
.ct-btn-primary:focus-visible{outline:none;box-shadow:0 0 0 3px var(--claro-ring)}
.ct-btn-primary:disabled{background:var(--surface-3)!important;color:var(--ink-4)!important;box-shadow:inset 0 0 0 1px var(--line)}
.ct-btn-primary:disabled .ct-spin{border-color:rgba(95,103,115,.28);border-top-color:var(--ink-3)}
.ct-btn-primary.ct-btn-ok:disabled{background:var(--ok-bg)!important;color:var(--ok-t)!important;box-shadow:inset 0 0 0 1px var(--ok-line);cursor:default}
.ct-btn-sec{background:#fff;color:var(--ink-2);border:1px solid var(--line-3);box-shadow:0 1px 2px rgba(16,24,40,.05);border-radius:8px;font-weight:600;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.ct-btn-sec:hover{background:var(--surface-2);border-color:#B5BCC5;color:var(--ink)}

  <p>Algo impediu o carregamento (provavelmente uma das bibliotecas externas não chegou a baixar — rede corporativa/firewall pode estar bloqueando). Detalhe técnico abaixo, encaminhe pra quem está ajustando a ferramenta:</p>

<script>
  function showBootError(msg) {
    var box = document.getElementById('boot-error');
    var detail = document.getElementById('boot-error-detail');
    if (box && detail) {
      detail.textContent = msg;
      box.style.display = 'block';
    }
  }
  window.addEventListener('error', function (e) {
    // erro vindo do leitor de prints (worker do Tesseract.js) não é "a ferramenta não carregou": a leitura trata sozinha
    if (e && (/^blob:/.test(String(e.filename || '')) || /tesseract|WorkerGlobalScope|importScripts/i.test(String(e.filename || '') + ' ' + String(e.message || '')))) return;
    showBootError((e && e.message) || String(e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Promise rejeitada: ' + ((e && e.reason && e.reason.message) || String(e && e.reason)));
  });
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (typeof React === 'undefined') { showBootError('React não carregou (CDN unpkg.com/react pode estar bloqueado).'); return; }
      if (typeof ReactDOM === 'undefined') { showBootError('ReactDOM não carregou (CDN unpkg.com/react-dom pode estar bloqueado).'); return; }
      if (typeof XLSX === 'undefined') { showBootError('XLSX não carregou (CDN cdn.sheetjs.com pode estar bloqueado).'); return; }
      if (document.getElementById('root') && document.getElementById('root').childElementCount === 0) {
        showBootError('As bibliotecas carregaram, mas a ferramenta não desenhou nada na tela. Avise quem está ajustando a ferramenta.');
      }
    }, 4000);
  });
</script>

//   1) NEGADO É NEGADO: se qualquer nome da lista abaixo negar no print, o pedido não é enviado (não há hierarquia);
//   2) mais de 10 logins: precisa do "de acordo" de alguém da lista. Se a leitura não achar, o analista indica o
//      nome (ou "Outros") e o pedido vai com ATENÇÃO para o validador conferir;
//   3) o Nº do ID digitado precisa ser o mesmo que aparece no print (no e-mail ele vem no assunto:

// Skills digitadas à mão (outra matriz): uma por linha; "13869101" ou "13869101;3" (proficiência opcional, padrão 3).
// Também aceita várias skills na mesma linha separadas por vírgula, ponto e vírgula, espaço ou tab.
function parseSkillsInput(raw) {
    const out = [];
    const seen = new Set();
    String(raw || '').split(/\r?\n/).forEach((line) => {
        let last = null;
        line.split(/[\s;,]+/).filter(Boolean).forEach((tok) => {
            if (/^\d{4,}$/.test(tok)) {
                if (!seen.has(tok)) { seen.add(tok); last = { skill: tok, prof: '3', set: false }; out.push(last); }
                else last = null;
            } else if (/^[1-9]$/.test(tok) && last && !last.set) {
                last.prof = tok;
                last.set = true;
            }
        });
    });
    return out.map((s) => ({ skill: s.skill, prof: s.prof }));
}
function chunkList(list, size) {
    const out = [];
    for (let i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
    return out.length ? out : [[]];
}
// "Outra matriz": ALM (Almaviva), TEL (Telemática) e AEC já estão na automação, então não valem aqui
function otherMatrixBlocked(text) {
    const s = String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    return /(^|[^a-z])(alm|almaviva|aec)([^a-z]|$)/.test(s) || /(^|[^a-z])tel(em[a-z]*)?([^a-z]|$)/.test(s);
}
function isS2S(name) { return /(^|[^A-Za-z0-9])S2S([^A-Za-z0-9]|$)/i.test(String(name || '')); }

function looksLikeSkillCode(s) {
    // Skill numbers are always plain digit strings (some legacy ones are as
    // short as 2 digits) — reliable no matter how a campaign's name row above
    // is merged, offset, or labelled, which varies a lot across tabs.

      sheetName,

      collapsedCounts: renamed.collapsedCounts,

      // rascunho "leandro") vira uma entrada nova, não um merge com o

// Abrir uma matriz grande (SheetJS) congelava a página por alguns segundos. Agora a leitura roda numa thread separada
// (Web Worker), com as mesmas funções acima, e a tela continua respondendo. Se o worker não puder ser usado (navegador

function xlsxPronto() {
  if (typeof XLSX !== 'undefined') return Promise.resolve(XLSX);
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const espera = () => {
      if (typeof XLSX !== 'undefined') return resolve(XLSX);
      if (Date.now() - t0 > 30000) return reject(new Error('a biblioteca de planilhas (SheetJS) não carregou'));
      setTimeout(espera, 100);
    };
    espera();
  });

  return buildMatrixFromWorkbook(wb.SheetNames, (sheetName) => readSheetRows(X, wb.Sheets[sheetName]));

      'const DISPLAY_NAME_OVERRIDES = ' + JSON.stringify(DISPLAY_NAME_OVERRIDES) + ';\n' +
      'const MANUAL_CAMPAIGNS = ' + JSON.stringify(MANUAL_CAMPAIGNS) + ';\n' +
      'const HIDDEN_SHEET_NAMES = ' + JSON.stringify(HIDDEN_SHEET_NAMES) + ';\n' +
      'const NO_DEDUP_CAMPAIGNS = ' + JSON.stringify(NO_DEDUP_CAMPAIGNS) + ';\n';
    const codigo = '"use strict";\n' + constantes + funcoes + '\nimportScripts(' + JSON.stringify(XLSX_URL) + ');\n' +
      'onmessage = function (e) {\n' +
      '  try {\n' +
      '    var wb = XLSX.read(e.data, { type: "array", cellStyles: true });\n' +

      '  } catch (err) { postMessage({ ok: false, erro: String((err && err.message) || err) }); }\n' +

// ---------- arquivo com os logins ----------
// O analista recebe um arquivo (.xlsx, .xls, .csv ou .txt) com os logins. Em vez
// de copiar um por um, ele solta o arquivo no bloco dos logins (passo 3) e a ferramenta
// acha sozinha a coluna certa: primeiro procura um cabeçalho tipo "Login"; se
// não achar, usa a coluna cujas células mais parecem login (uma palavra curta,
// sem espaço, de preferência com número).
const LOGIN_HEADER_RE = /login|usuario|matricula|\buser\b/;
const HEADER_WORD_RE = /^(logins?|usuarios?|user|users|matriculas?|nome|name|id|re)$/;
const NOT_A_LOGIN_RE = /^(logins?|usuarios?|user|users|matriculas?|nome|name)$/;
function headerPriority(cell) {
  if (/login/.test(cell)) return 0;
  if (/usuario|\buser\b/.test(cell)) return 1;
  return 2;
}
function looksLikeLogin(s) {
  return /^[A-Za-z0-9][A-Za-z0-9._@\-]{1,39}$/.test(s);
}
function extractLoginsFromRows(rawRows) {
  let rows = rawRows.map((r) => (r || []).map((c) => (c == null ? '' : String(c)).trim()));
  // uma única linha com vários valores (ex.: "ab12, cd34, ef56") é uma lista na horizontal
  const filled = rows.filter((r) => r.some((c) => c));
  if (filled.length === 1 && filled[0].filter((c) => c).length >= 2) rows = filled[0].filter((c) => c).map((c) => [c]);
  const maxCol = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const candidates = [];
  // 1) colunas com cabeçalho "Login", "Usuário", "Matrícula"... (nas 15 primeiras linhas)
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    for (let c = 0; c < maxCol; c++) {
      const cell = normalize(rows[r][c] || '');
      if (cell && cell.length <= 40 && LOGIN_HEADER_RE.test(cell)) {
        candidates.push({ col: c, startRow: r + 1, how: 'coluna "' + rows[r][c] + '"', pri: headerPriority(cell), r, c });
      }
    }
  }
  candidates.sort((a, b) => a.pri - b.pri || a.r - b.r || a.c - b.c);
  // 2) sem cabeçalho (ou cabeçalho sem nada embaixo): as colunas com mais cara de login
  const scored = [];
  for (let c = 0; c < maxCol; c++) {
    let withDigit = 0;
    let plain = 0;
    for (const row of rows) {
      const v = row[c] || '';
      if (looksLikeLogin(v)) {
        plain++;
        if (/\d/.test(v)) withDigit++;
      }
    }
    if (plain > 0) scored.push({ c, withDigit, plain });
  }
  scored.sort((a, b) => b.withDigit - a.withDigit || b.plain - a.plain || a.c - b.c);
  for (const s of scored) {
    const first = rows.length ? rows[0][s.c] || '' : '';
    candidates.push({ col: s.c, startRow: HEADER_WORD_RE.test(normalize(first)) ? 1 : 0, how: 'coluna ' + colLetter(s.c) });
  }
  for (const cand of candidates) {
    const list = [];
    for (let r = cand.startRow; r < rows.length; r++) {
      const v = rows[r][cand.col] || '';
      if (v && !NOT_A_LOGIN_RE.test(normalize(v))) list.push(v);
    }
    if (list.length > 0) return { logins: [...new Set(list)], how: cand.how };
  }
  return { logins: [], how: '' };
}
async function readLoginsFile(XLSXlib, file) {
  const name = (file.name || '').toLowerCase();
  if (/\.(txt|csv|tsv)$/.test(name) || (file.type || '').indexOf('text/') === 0) {
    const text = await file.text();
    return extractLoginsFromRows(text.split(/\r?\n/).map((line) => line.split(/[\t;,]/)));
  }
  const buf = await file.arrayBuffer();
  const wb = XLSXlib.read(buf, { type: 'array' });
  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName];
    if (!sheet) continue;
    const rows = XLSXlib.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    const res = extractLoginsFromRows(rows);
    if (res.logins.length > 0) return { ...res, sheetName: wb.SheetNames.length > 1 ? sheetName : '' };
  }
  return { logins: [], how: '' };
}

// ---------- print da aprovação ----------
// Lê a imagem colada/enviada, reduz (largura máx. 1920px) e converte para JPEG
// para o pedido caber folgado no envio ao Apps Script.
function getImageFromClipboard(cd) {
  if (!cd) return null;
  const items = cd.items ? Array.from(cd.items) : [];
  for (const it of items) {
    if (it.kind === 'file' && /^image\//.test(it.type || '')) {
      const f = it.getAsFile();
      if (f) return f;
    }
  }
  if (cd.files && cd.files.length > 0) {
    for (const f of Array.from(cd.files)) if (/^image\//.test(f.type || '')) return f;
  }
  return null;
}
function readImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type || '')) {
      reject(new Error('Esse arquivo não é uma imagem. Use PNG ou JPG, ou cole o print com Ctrl+V.'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler a imagem.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Não consegui abrir essa imagem.'));
      img.onload = () => {
        const scale = Math.min(1, 1920 / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.85;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length > 1800000 && q > 0.5) {
          q -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', q);
        }
        resolve({ dataUrl, w, h, kb: Math.round((dataUrl.length * 0.75) / 1024) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Arquivos aceitos no card "Aprovação": imagem (reduzida a JPEG) ou documento de até 3 MB.
const APPROVAL_MAX_FILES = 6;
const APPROVAL_MAX_DOC_BYTES = 3 * 1024 * 1024;
const APPROVAL_MAX_TOTAL_BYTES = 8 * 1024 * 1024;
const APPROVAL_EXT = ['pdf', 'eml', 'msg', 'txt', 'csv', 'doc', 'docx', 'xls', 'xlsx'];
const APPROVAL_ACCEPT = 'image/*,.pdf,.eml,.msg,.txt,.csv,.doc,.docx,.xls,.xlsx';
function getFilesFromClipboard(cd) {
  if (!cd) return [];
  const out = [];
  const items = cd.items ? Array.from(cd.items) : [];
  for (const it of items) {
    if (it.kind === 'file') {
      const f = it.getAsFile();
      if (f) out.push(f);
    }
  }
  if (out.length === 0 && cd.files && cd.files.length > 0) return Array.from(cd.files);
  return out;
}
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não consegui ler "' + (file.name || 'arquivo') + '".'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
async function readApprovalFile(file) {
  if (/^image\//.test(file.type || '')) {
    const r = await readImageFile(file);
    return { kind: 'img', dataUrl: r.dataUrl, w: r.w, h: r.h, kb: r.kb, bytes: Math.round(r.dataUrl.length * 0.75) };
  }
  const m = /\.([A-Za-z0-9]+)$/.exec(file.name || '');
  const ext = m ? m[1].toLowerCase() : '';
  if (APPROVAL_EXT.indexOf(ext) < 0) {
    throw new Error('"' + (file.name || 'arquivo') + '": tipo não aceito. Use imagem, PDF, e-mail (.eml/.msg), Word, Excel ou texto.');
  }
  if (file.size > APPROVAL_MAX_DOC_BYTES) {
    throw new Error('"' + file.name + '" passa de ' + Math.round(APPROVAL_MAX_DOC_BYTES / 1048576) + ' MB.');
  }
  const dataUrl = await readFileAsDataUrl(file);
  return { kind: 'file', dataUrl, w: 0, h: 0, kb: Math.max(1, Math.round(file.size / 1024)), bytes: file.size };
}

// A leitura roda no navegador com o Tesseract.js (baixado na primeira vez que precisar; depois fica guardado).
// Ela é um filtro para o analista: quem decide continua sendo o validador, olhando o print na página de aprovação.
const LeituraAcordo = (function () {
  'use strict';

  function tiraAcento(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  function palavras(texto) { return semAcento(texto).match(/[A-Z0-9]+|\?/g) || []; }
  // palavras de uma linha com a posição: { u: MAIÚSCULA, s: como está escrita, a: início, b: fim }
  function palavrasPos(sa) {

    const x = chaveNome(a), y = chaveNome(b);

    if (x.length !== y.length || x.length < 6) return false;
    let dif = 0;
    for (let i = 0; i < x.length; i++) { if (x.charAt(i) !== y.charAt(i)) { dif++; if (dif > 1) return false; } }
    return true;
  }

  // vírgula, ":" ou "<" no meio quer dizer que não é a mesma pessoa. Com solto = true também aceita "." "_" "-"
  // (serve para achar "marcos.paulo@..." e saber que o nome aparece no print).
  function acharNome(sa, T, pedacos, solto) {

    for (let i = 0; i < T.length; i++) {
      if (!palavraIgual(T[i].u, pedacos[0])) continue;

  // Lê o texto de UM print. Devolve { sim: {nome: trecho}, nao: {nome: trecho}, misto: {nome: trecho}, encontrados: {nome: true} }
  // (misto = sim e não na mesma mensagem: resposta com ressalva)
  function analisar(texto) {
    const lista = aprovadores();
    const res = { sim: {}, nao: {}, misto: {}, encontrados: {} };
    const L = String(texto || '').split(/\r\n|\r|\n|\u000b|\u2028|\u2029/)
      .map(function (l) { return l.replace(/\s+/g, ' ').trim(); })
      .filter(function (l) { return l; })
      .map(function (l) { return infoLinha(l, lista); });
    const marcar = function (nome, s) {
      if (s.nega && s.aprova) { if (!res.misto[nome]) res.misto[nome] = s.trechoNao || s.trechoSim || '(sem trecho)'; return; }
      if (s.nega && !res.nao[nome]) res.nao[nome] = s.trechoNao || '(sem trecho)';
      if (s.aprova && !res.sim[nome]) res.sim[nome] = s.trechoSim || '(sem trecho)';
    };
    for (let i = 0; i < L.length; i++) {
      L[i].vistos.forEach(function (idx) { res.encontrados[lista[idx].nome] = true; });
      for (let a = 0; a < lista.length; a++) {
        const cab = cabecalhoDe(L, i, a);
        if (!cab) continue;
        const nome = lista[a].nome;
        // 1) a mensagem que vem junto ou logo abaixo do nome
        let linhas = cab.tipo === 'puro' ? [] : [cab.texto];
        if (cab.tipo !== 'compacto') linhas = linhas.concat(trechoDepois(L, i, lista));
        marcar(nome, sinaisDoTrecho(linhas));
        // 2) assinatura de e-mail: "De acordo." / "Atenciosamente," / "Fulano" (print cortado, sem o cabeçalho)
        if (cab.tipo === 'puro' && cab.soNome && i >= 2 && ehFecho(L[i - 1])) {
          const bloco = [];
          let deOutraPessoa = false;
          for (let k = i - 2; k >= 0 && bloco.length < 4; k--) {
            const ln = L[k];
            if (ln.separador || ln.remetente || ln.dest || ln.meta || ln.data) break;
            if (ln.nomeComHora || pareceNome(ln) || ehCabecalhoDeAlguem(L, k, lista)) { deOutraPessoa = !cabecalhoDe(L, k, a); break; }
            bloco.unshift(ln.bruta);
          }
          if (!deOutraPessoa) marcar(nome, sinaisDoTrecho(bloco));
        }
      }
    }
    return res;
  }

  // Junta as leituras de todos os prints do pedido. Não há hierarquia: NEGADO É NEGADO.
  //   alguém da lista negou (mesmo que outra pessoa, ou ela mesma, tenha dado o "de acordo")  -> 'negado'
  //   ninguém negou e alguém da lista deu o "de acordo"                                        -> 'ok'
  //   a leitura não achou resposta de ninguém da lista, ou só achou resposta com ressalva      -> 'duvida'
  // Ressalva = sim e não na MESMA mensagem ("De acordo, mas não rodar antes das 18h"): não é negativa; fica em
  // "ressalva" e vai como aviso para o validador.
  function decidir(leituras) {
    const lista = aprovadores();
    const sim = {}, nao = {}, misto = {}, enc = {};
    (leituras || []).forEach(function (r) {
      Object.keys(r.sim).forEach(function (n) { if (!sim[n]) sim[n] = r.sim[n]; });
      Object.keys(r.nao).forEach(function (n) { if (!nao[n]) nao[n] = r.nao[n]; });
      Object.keys(r.misto || {}).forEach(function (n) { if (!misto[n]) misto[n] = r.misto[n]; });
      Object.keys(r.encontrados).forEach(function (n) { enc[n] = true; });
    });
    const de = function (f) { return lista.filter(function (a) { return f(a.nome); }).map(function (a) { return a.nome; }); };
    const out = { estado: 'duvida', quem: [], trecho: '', trechoRessalva: '',
      negou: de(function (n) { return Boolean(nao[n]); }),
      ressalva: de(function (n) { return Boolean(misto[n]) && !nao[n]; }),
      aprovou: de(function (n) { return Boolean(sim[n]) && !nao[n] && !misto[n]; }),
      encontrados: de(function (n) { return Boolean(enc[n]); }) };
    if (out.ressalva.length > 0) out.trechoRessalva = misto[out.ressalva[0]];
    if (out.negou.length > 0) { out.estado = 'negado'; out.quem = out.negou; out.trecho = nao[out.negou[0]]; }
    else if (out.aprovou.length > 0) { out.estado = 'ok'; out.quem = out.aprovou; }
    return out;
  }
  function juntarNomes(l, conj) { return l.length <= 1 ? l.join('') : l.slice(0, -1).join(', ') + ' ' + (conj || 'e') + ' ' + l[l.length - 1]; }
  function nomes() { return ACORDO_APROVADORES.map(function (a) { return a.nome; }); }

  // ---------------------------------------------------------------- Nº do ID no print
  // No e-mail o número do pedido vem no assunto ("... TROCA DE SKILL MÓVEL Nº 41016 | DE: ... - PARA: ...") e no
  // corpo ("Recebemos a solicitação nº 41016 por meio do nosso Portal de Demanda").
  // numerosDoTexto devolve os números lidos em UM print:
  //   soltos    = toda sequência de dígitos do texto;
  //   rotulados = os que vêm logo depois de "Nº", "ID", "solicitação", "chamado"... ou no formato do assunto.
  // Letra que o leitor confunde com número (O por 0, l ou I por 1) é trocada quando o pedaço começa com dígito.
  const RE_NUM_APROX = /(^|[^0-9A-Z])([0-9][0-9OIL]{2,10})(?![0-9A-Z])/g;
  const RE_ROTULOS = [
    /(?:\bN ?[º°OE2*]\.?|\bN[.:]|\bNUMERO|\bNRO?\.?|\bID|\bSOLICITACAO|\bCHAMADO|\bDEMANDA|\bPROTOCOLO|\bTICKET|#)[\s:#=.\-]{0,3}(?:N ?[º°O]\.?[\s:.\-]{0,2})?([0-9][0-9OIL]{2,10})(?![0-9A-Z])/g,
    /(?:^|[^0-9A-Z])([0-9][0-9OIL]{2,10})\s*[|!IL1\/\\]\s*DE\b/g,                  // "... 41016 | DE: campanha - PARA: campanha"
    /\bSKILL\b[^0-9\n]{0,24}?([0-9][0-9OIL]{2,10})(?![0-9A-Z])/g   // "TROCA DE SKILL MÓVEL (Nº mal lido) 41016"
  ];
  function soDigitos(s) { return String(s).replace(/O/g, '0').replace(/[IL]/g, '1'); }
  function semZeros(s) { return String(s).replace(/^0+(?=\d)/, ''); }
  function numeroLimpo(numero) { return semZeros(String(numero == null ? '' : numero).replace(/\D/g, '')); }
  // Número em negrito, pequeno ou grifado sai do leitor com mais trocas: B por 8, S por 5, G por 6, Z por 2, D ou Q
  // por 0, "|" por 1, um espaço ou ponto no meio ("41 371", "41.371") ou o "Nº" grudado ("N°41371" lido "N941371").
  // Esses jeitos vão em "aproximados" e só servem para ACHAR o número digitado no print; nunca para dizer que o
  // print é de outro pedido (isso continua só com os "rotulados").
  const TROCA_DIGITO = { O: '0', Q: '0', D: '0', I: '1', L: '1', '|': '1', '!': '1', Z: '2', S: '5', G: '6', B: '8' };
  function aproximados(sa) {
    const out = {};
    const vale = function (bruto) {
      let dig = 0, n = '';
      for (let i = 0; i < bruto.length; i++) {
        const ch = bruto.charAt(i);
        if (ch >= '0' && ch <= '9') { dig++; n += ch; } else if (TROCA_DIGITO[ch]) n += TROCA_DIGITO[ch]; else return;
      }
      if (n.length >= 4 && n.length <= 12 && dig >= n.length * 0.6 && /[0-9]/.test(bruto.charAt(0) + bruto.charAt(bruto.length - 1))) out[semZeros(n)] = true;
    };
    const re = /[0-9A-Z|!]+/g;
    const W = [];
    let m;
    while ((m = re.exec(sa))) W.push({ t: m[0], a: m.index, b: m.index + m[0].length });
    const junto = function (i) { return i + 1 < W.length && W[i + 1].a - W[i].b === 1 && /^[ .,]$/.test(sa.charAt(W[i].b)); };
    for (let i = 0; i < W.length; i++) {
      vale(W[i].t);
      if (junto(i)) vale(W[i].t + W[i + 1].t);
      const mN = /^N[º°92QO]([0-9OIL]{4,11})$/.exec(W[i].t);   // "Nº" grudado no número
      if (mN) vale(mN[1]);
    }
    return Object.keys(out);
  }
  function numerosDoTexto(texto) {
    const sa = semAcento(texto);
    const soltos = {}, rot = {};
    (sa.match(/\d+/g) || []).forEach(function (n) { soltos[semZeros(n)] = true; });
    let m;
    RE_NUM_APROX.lastIndex = 0;
    while ((m = RE_NUM_APROX.exec(sa))) soltos[semZeros(soDigitos(m[2]))] = true;
    RE_ROTULOS.forEach(function (re) {
      re.lastIndex = 0;
      while ((m = re.exec(sa))) {
        const n = semZeros(soDigitos(m[1]));
        if (n.length >= 3) rot[n] = true;
      }
    });
    return { soltos: Object.keys(soltos), rotulados: Object.keys(rot), aproximados: aproximados(sa) };
  }
  // junta os números de duas leituras do mesmo print (a 1ª e a releitura ampliada)
  function juntarNumeros(a, b) {
    const u = function (x, y) { const o = {}; (x || []).concat(y || []).forEach(function (n) { o[n] = true; }); return Object.keys(o); };
    a = a || {}; b = b || {};
    return { soltos: u(a.soltos, b.soltos), rotulados: u(a.rotulados, b.rotulados), aproximados: u(a.aproximados, b.aproximados) };
  }
  // Confere o Nº do ID digitado com os números lidos nos prints (lista = um numerosDoTexto por print lido).
  //   'ok'         = o número digitado aparece em algum print
  //   'diferente'  = não aparece, e o print mostra outro número de pedido (devolvido em "lidos")
  //   'ausente'    = não aparece e a leitura não achou número de pedido nenhum
  //   'sem_numero' = o analista ainda não digitou o Nº do ID
  function conferirId(numero, lista) {
    const n = numeroLimpo(numero);
    if (!n) return { estado: 'sem_numero', numero: '', lidos: [] };
    let achou = false;
    const lidos = [];
    (lista || []).forEach(function (p) {
      if (!p) return;
      const rot = p.rotulados || [], soltos = p.soltos || [], aprox = p.aproximados || [];
      if (rot.indexOf(n) >= 0 || (n.length >= ACORDO_ID_MIN_SOLTO && (soltos.indexOf(n) >= 0 || aprox.indexOf(n) >= 0))) achou = true;
      rot.forEach(function (x) { if (x !== n && lidos.indexOf(x) < 0) lidos.push(x); });
    });
    if (achou) return { estado: 'ok', numero: n, lidos: [] };
    return { estado: lidos.length > 0 ? 'diferente' : 'ausente', numero: n, lidos: lidos.slice(0, 3) };
  }

  // ---------------------------------------------------------------- "Outros"
  // Regra interna (não aparece na tela): o comentário precisa ter uma palavra de cada grupo de ACORDO_OUTROS_PALAVRAS.
  function comentarioLibera(comentario) {
    const tok = palavras(comentario);
    return ACORDO_OUTROS_PALAVRAS.length > 0 && ACORDO_OUTROS_PALAVRAS.every(function (grupo) {
      return grupo.some(function (p) { return tok.indexOf(semAcento(p)) >= 0; });
    });
  }

  // ---------------------------------------------------------------- o que a tela faz
  // dados  = o que lerPrints devolveu: { leituras, numeros, falhas, motivo }
  // opcoes = { exigeNome, manual, numero, comentario }
  //   exigeNome  = verdadeiro quando passa de 10 logins (precisa do "de acordo" de alguém da lista);
  //                falso = só confere negativa e Nº do ID (print de campanha S2S com até 10 logins)
  //   manual     = o que o analista escolheu em "Quem deu o de acordo?" (um nome da lista ou "Outros")
  //   numero     = Nº do ID digitado;  comentario = texto do comentário do pedido
  // Devolve { linhas, barrado, pedeNome, indisponivel, decisao, id, envio, resumo, atencao }:
  //   linhas   = [{ tom: 'ok' | 'aviso' | 'erro' | 'info', texto, forte }] para mostrar na caixa "Leitura do print"
  //   barrado  = o pedido não é enviado e não adianta indicar nome (alguém negou, ou o Nº do ID não é o do print)
  //   pedeNome = mostrar a lista "Quem deu o de acordo?"
  //   envio    = pode enviar; vai no pedido (campo acordo). resumo = frase curta para o analista depois do envio
  function resultado(dados, opcoes) {
    dados = dados || {};
    opcoes = opcoes || {};
    const leituras = dados.leituras || [];
    const falhas = Math.max(0, Number(dados.falhas) || 0);
    const exigeNome = opcoes.exigeNome !== false;
    const d = decidir(leituras);
    const indisponivel = leituras.length === 0;
    const motivo = indisponivel ? String(dados.motivo || '').slice(0, 120) : '';
    const idc = indisponivel ? { estado: numeroLimpo(opcoes.numero) ? 'indisponivel' : 'sem_numero', numero: numeroLimpo(opcoes.numero), lidos: [] }
      : conferirId(opcoes.numero, dados.numeros);
    const out = { linhas: [], barrado: false, pedeNome: false, indisponivel: indisponivel, decisao: d, id: idc, envio: null, resumo: '', atencao: false };
    const linha = function (tom, texto, forte) { out.linhas.push({ tom: tom, texto: texto, forte: Boolean(forte) }); };

    // 1) negado é negado
    if (d.estado === 'negado') {
      const trecho = d.trecho && d.trecho !== '(sem trecho)' ? ' (trecho lido: “' + d.trecho + '”)' : '';
      out.barrado = true;
      linha('erro', 'A troca não segue: ' + juntarNomes(d.quem) + (d.quem.length > 1 ? ' negaram' : ' negou') + ' no print' + trecho + '.', true);
      linha('erro', 'Negado é negado: com a negativa de qualquer aprovador o pedido não é enviado. Se a leitura entendeu errado, anexe um print mais nítido só com a resposta.');
      return out;
    }

    // 2) quem deu o "de acordo" (só quando passa de 10 logins)
    let estado = '', quem = [];
    const comRessalva = d.ressalva.length > 0
      ? juntarNomes(d.ressalva) + (d.ressalva.length > 1 ? ' responderam' : ' respondeu') + ' com ressalva' +
        (d.trechoRessalva && d.trechoRessalva !== '(sem trecho)' ? ' (“' + d.trechoRessalva + '”)' : '')
      : '';
    if (!exigeNome) {
      estado = 'id';
      if (comRessalva) linha('aviso', comRessalva + ': o validador vai conferir.');
    } else if (d.estado === 'ok') {
      estado = 'ok';
      quem = d.quem;
      linha('ok', '“De acordo” lido no print: ' + juntarNomes(d.quem) + '.');
      if (comRessalva) linha('aviso', comRessalva + ': o validador vai conferir.');
    } else {
      out.pedeNome = true;
      const alvo = semAcento(opcoes.manual).replace(/\s+/g, ' ').trim();
      let indicado = '';
      if (alvo) aprovadores().forEach(function (a) { if (semAcento(a.nome) === alvo) indicado = a.nome; });
      const base = indisponivel
        ? 'Não consegui ler o print neste computador' + (motivo ? ' (' + motivo + ')' : '') + '.'
        : comRessalva ? comRessalva + ' e a leitura não sabe dizer se vale como “de acordo”.'
        : 'A leitura do print não identificou de quem é o “de acordo”.';
      if (indicado) {
        estado = 'manual';
        quem = [indicado];
        // se a leitura nem achou o nome escolhido no print, vale avisar (pode ter sido escolhido o nome errado)
        const semNome = !indisponivel && d.encontrados.indexOf(indicado) < 0;
        linha('aviso', base + ' “De acordo” indicado por você: ' + indicado + '.' + (semNome ? ' A leitura não achou esse nome no print.' : '') +
          ' O validador vai conferir o print.');
      } else if (alvo === 'OUTROS') {
        if (comentarioLibera(opcoes.comentario)) {
          estado = 'outros';
          quem = ['Outros'];
          linha('aviso', base + ' Você indicou “Outros”: o validador vai conferir o comentário e o print.');
        } else {
          linha('aviso', base + ' “Outros” só segue em caso combinado com a supervisão, com a justificativa escrita no comentário.');
        }
      } else {
        linha('aviso', base + ' Indique quem deu o “de acordo”: o pedido vai com um aviso para o validador conferir o print.');
      }
    }
    if (falhas > 0 && !indisponivel) linha('aviso', falhas === 1 ? 'Um dos prints não pôde ser lido.' : falhas + ' prints não puderam ser lidos.');

    // 3) Nº do ID: o número digitado tem que ser o mesmo do print
    const N = idc.numero;
    let idBarra = false;
    if (idc.estado === 'ok') {
      linha('ok', 'Nº do ID ' + N + ' confere com o print.');
    } else if (idc.estado === 'sem_numero') {
      idBarra = true;
      linha('info', 'Digite o Nº do ID (passo 3): ele precisa ser o mesmo número que aparece no print.');
    } else if (idc.estado === 'indisponivel') {
      linha('aviso', 'O Nº do ID ' + N + ' não foi conferido no print (leitura indisponível): o validador vai conferir.');
    } else if (!ACORDO_ID_BARRA) {
      // com ACORDO_ID_BARRA desligado o número fora do print não barra: vira aviso para o validador
      linha('aviso', (idc.estado === 'diferente'
        ? 'O Nº do ID digitado (' + N + ') não é o do print (a leitura achou ' + juntarNomes(idc.lidos, 'e') + ')'
        : 'O Nº do ID ' + N + ' não aparece no print') + ': vai como aviso para o validador.');
    } else if (idc.estado === 'diferente') {
      idBarra = true;
      out.barrado = true;
      linha('erro', 'O Nº do ID digitado (' + N + ') não é o do print: no print a leitura achou ' + juntarNomes(idc.lidos, 'e') +
        '. Corrija o número ou anexe o print do pedido certo, com a linha do assunto inteira e nítida.', true);
    } else {
      idBarra = true;
      linha('aviso', 'Não achei o Nº do ID ' + N + ' no print. Anexe um print que mostre a linha do assunto do e-mail inteira: é nela que aparece o “Nº”.', true);
    }

    if (estado && !idBarra) {
      const idEnvio = idc.estado === 'ok' ? 'ok' : (idc.estado === 'indisponivel' ? 'indisponivel' : 'nao_achou');
      out.envio = { v: 2, estado: estado, quem: quem, encontrados: d.encontrados, ressalva: d.ressalva, id: idEnvio, idLidos: idc.lidos || [],
        indisponivel: indisponivel, falhas: falhas, motivo: motivo };
      out.atencao = estado === 'manual' || estado === 'outros' || idEnvio !== 'ok' || falhas > 0 || d.ressalva.length > 0;
      const idTxt = idEnvio === 'ok' ? 'Nº do ID ' + N + ' conferido no print.' : 'Nº do ID ' + N + ' não conferido no print: o validador vai conferir.';
      out.resumo = (estado === 'ok' ? 'Leitura do print: “de acordo” de ' + juntarNomes(quem) + '. '
        : estado === 'manual' ? '“De acordo” indicado por você: ' + quem[0] + ' (o validador vai conferir o print). '
        : estado === 'outros' ? '“De acordo” indicado por você: Outros (o validador vai conferir o comentário e o print). '
        : 'Leitura do print: ') + idTxt;
    }
    return out;
  }

  // ---------------------------------------------------------------- OCR no navegador (Tesseract.js)
  // O leitor é baixado só quando precisa (a 1ª vez que um print tem de ser lido) e fica guardado no navegador.
  // Tenta o jsDelivr e, se a rede bloquear, o unpkg (o mesmo de onde a ferramenta já baixa o React).
  // Se nenhum responder, a leitura fica "indisponível": o analista indica quem deu o "de acordo" e o validador confere.
  const TESS = [
    { lib: 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js',
      worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js',
      core: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0',
      lang: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/por@1.0.0/4.0.0_best_int' },
    { lib: 'https://unpkg.com/tesseract.js@7.0.0/dist/tesseract.min.js',
      worker: 'https://unpkg.com/tesseract.js@7.0.0/dist/worker.min.js',
      core: 'https://unpkg.com/tesseract.js-core@7.0.0',
      lang: 'https://unpkg.com/@tesseract.js-data/por@1.0.0/4.0.0_best_int' }
  ];
  const TETO_PIXELS = 5e6;      // tamanho máximo da imagem ampliada (segura o tempo de leitura em print de tela cheia)
  let motor = null;             // Promise do leitor (worker do Tesseract)
  let motorOcioso = null;
  let emUso = 0;                // leituras em andamento (o leitor não é solto no meio delas)
  let avisoAtual = null;        // quem está acompanhando o andamento agora
  let fila = Promise.resolve(); // um print de cada vez
  const guardadas = {};         // imagem -> Promise da leitura (não lê duas vezes o mesmo print)
  let quebra = null;            // rejeita a leitura em andamento se o worker do leitor quebrar no meio

  // Erro dentro do worker do leitor (a rede barrou um arquivo dele, faltou memória...) chega à página como um erro
  // comum. Aqui a leitura em andamento é encerrada na hora (fica "indisponível" e o analista segue pelo modo manual),
  // em vez de esperar o prazo máximo. O quadro "A ferramenta não carregou" ignora esse tipo de erro (ver o 1º script).
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('error', function (e) {
      const arquivo = String((e && e.filename) || ''), msg = String((e && e.message) || '');
      if (!/^blob:/.test(arquivo) && !/tesseract|WorkerGlobalScope|importScripts/i.test(arquivo + ' ' + msg)) return;
      if (quebra) {
        const q = quebra;
        quebra = null;
        q(new Error('o leitor de prints parou (' + msg.slice(0, 80) + ')'));
      }
    });
  }
  function vigiado(promessa) {
    return new Promise(function (resolve, reject) {
      quebra = reject;
      promessa.then(function (v) { quebra = null; resolve(v); }, function (e) { quebra = null; reject(e); });
    });
  }

  function comPrazo(promessa, ms, msg) {
    return new Promise(function (resolve, reject) {

      const c = l.split('\t');

      if (!txt) return;
      const k = c[2] + '.' + c[3] + '.' + c[4];
      const x = +c[6], y = +c[7], x2 = x + (+c[8]), y2 = y + (+c[9]);
      let li = L[k];
      if (!li) { li = L[k] = { x0: x, y0: y, x1: x2, y1: y2, t: [] }; ordem.push(li); }
      li.x0 = Math.min(li.x0, x); li.y0 = Math.min(li.y0, y); li.x1 = Math.max(li.x1, x2); li.y1 = Math.max(li.y1, y2);

      .map(function (o) { return { x0: (o.li.x0 - mg) / esc, y0: (o.li.y0 - mg) / esc, x1: (o.li.x1 - mg) / esc, y1: (o.li.y1 - mg) / esc }; });

  async function lerUm(arquivo) {

  // Releitura do Nº do ID: cada linha com número é recortada do print original e lida sozinha, bem ampliada, duas

  // (4 por 8, 8 por 6), costuma sair certo em pelo menos uma delas.
  async function relerLinhas(arquivo, linhas) {
    let texto = '';
    if (!linhas || linhas.length === 0) return { texto: texto, numeros: numerosDoTexto(texto) };
    const img = await abrirImagem(arquivo.original || arquivo.dataUrl);
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    const w = await pegarMotor();
    await w.setParameters({ tessedit_pageseg_mode: '7', user_defined_dpi: '0' });
    for (let k = 0; k < linhas.length; k++) {
      const L = linhas[k];

      const x0 = Math.max(0, Math.floor(L.x0 - alt)), x1 = Math.min(w0, Math.ceil(L.x1 + alt));
      const y0 = Math.max(0, Math.floor(L.y0 - alt * 0.35)), y1 = Math.min(h0, Math.ceil(L.y1 + alt * 0.35));

          fila = tarefa.catch(function () { /* o próximo print segue mesmo se este falhar */ });

// Se a aba for fechada ou recarregada enquanto o pedido espera a validação, a ferramenta mostra "Retomar". Fica só
// neste navegador, por até 3 dias, e sai da lista quando o template é baixado, quando o pedido é reprovado ou quando
// o analista muda o pedido. Os prints não ficam guardados: eles já foram junto com o pedido para o Apps Script.
const PENDENTES_CHAVE = 'ct-troca-pedidos-pendentes-v1';
const PENDENTES_MAX = 5;
const PENDENTES_VALIDADE_MS = 3 * 24 * 60 * 60 * 1000;
function lerPendentes() {
  try {
    const t = window.localStorage.getItem(PENDENTES_CHAVE);
    const l = t ? JSON.parse(t) : [];
    const agora = Date.now();
    return (Array.isArray(l) ? l : []).filter((p) => p && p.v === 1 && typeof p.ids === 'string' && p.ids && agora - Number(p.enviadoEm || 0) < PENDENTES_VALIDADE_MS);
  } catch (e) { return []; }
}
function gravarPendentes(lista) {
  try {
    if (lista.length) window.localStorage.setItem(PENDENTES_CHAVE, JSON.stringify(lista.slice(0, PENDENTES_MAX)));
    else window.localStorage.removeItem(PENDENTES_CHAVE);
  } catch (e) { /* navegador sem armazenamento (janela anônima bloqueada...): só não dá para retomar */ }
}
function guardarPendente(p) { gravarPendentes([p].concat(lerPendentes().filter((x) => x.ids !== p.ids))); }
function tirarPendente(ids) { if (ids) gravarPendentes(lerPendentes().filter((x) => x.ids !== ids)); }
function marcarPendente(ids, extra) { gravarPendentes(lerPendentes().map((x) => (x.ids === ids ? Object.assign({}, x, extra) : x))); }
// "impressão digital" do template (login;skill;proficiência de todas as linhas): antes de retomar, confere se a matriz
// carregada gera exatamente o template que foi para a validação
function impressaoTemplate(loginList, skills) {
  const n = Math.max(loginList.length, skills.length);
  let h = 2166136261;
  for (let i = 0; i < n; i++) {
    const s = (loginList[i] || '') + ';' + ((skills[i] && skills[i].skill) || '') + ';' + ((skills[i] && skills[i].prof) || '') + '\n';
    for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
  }
  return n + ':' + h.toString(16);
}
