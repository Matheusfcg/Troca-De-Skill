<div id="root"></div>
<div id="boot-error">
  <h2>A ferramenta não carregou</h2>
  <p>Algo impediu o carregamento (provavelmente uma das bibliotecas externas não chegou a baixar — rede corporativa/firewall pode estar bloqueando). Detalhe técnico abaixo, encaminhe pra quem está ajustando a ferramenta:</p>
  <pre id="boot-error-detail"></pre>
</div>
<script>
  function showBootError(msg) {
    var box = document.getElementById('boot-error');
    var detail = document.getElementById('boot-error-detail');
    if (box && detail) {
      detail.textContent = msg;
      box.style.display = 'block';
    }
  }
  window.addEventListener('error', function (e) {
    showBootError((e && e.message) || String(e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Promise rejeitada: ' + ((e && e.reason && e.reason.message) || String(e && e.reason)));
  });
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (typeof React === 'undefined') { showBootError('React não carregou (CDN unpkg.com/react pode estar bloqueado).'); return; }
      if (typeof ReactDOM === 'undefined') { showBootError('ReactDOM não carregou (CDN unpkg.com/react-dom pode estar bloqueado).'); return; }
      if (typeof XLSX === 'undefined') { showBootError('XLSX não carregou (CDN cdn.sheetjs.com pode estar bloqueado).'); return; }
      if (document.getElementById('root') && document.getElementById('root').childElementCount === 0) {
        showBootError('As bibliotecas carregaram, mas a ferramenta não desenhou nada na tela. Avise quem está ajustando a ferramenta.');
      }
    }, 4000);
  });
</script>

// Abas substituídas por uma versão nova com nome diferente (não
// necessariamente contendo "OLD", tipo "... - NOVA" em vez disso) — cada
// nome aqui vira uma aba inteira ignorada, igual ao filtro de "OLD", só
// que por nome exato em vez de padrão.
const HIDDEN_SHEET_NAMES = ['AEC RETENÇÃO RESIDENCIAL'];
// Campanhas onde o time confirmou que quer TODAS as linhas da planilha,
// mesmo quando skill e proficiência repetem exatamente — pra essas, a
// deduplicação (tanto a normal quanto a de "skill com prof diferente")
// não entra em ação nenhuma; cada linha bruta vira uma linha no resultado.
const NO_DEDUP_CAMPAIGNS = ['ATENDIMENTO MADRUGADA'];
// 0 -> A, 25 -> Z, 26 -> AA ...
function colLetter(index) {
  let n = index + 1;
  let s = '';
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

// "AD1:AF16" — onde o bloco está na aba (vazio se a leitura não conseguiu
// garantir a posição das células)
function blockRange(block) {
  if (block.col == null || block.col < 0) return '';
  return colLetter(block.col) + block.titleRow + ':' + colLetter(block.col + 2) + block.lastRow;
}

// Compara cada linha bruta da matriz com o que a ferramenta de fato gera:
//   ok      -> entra no resultado normalmente
//   both    -> entra, mas a mesma skill já apareceu antes com outra proficiência (as duas linhas ficam)
//   dup     -> mesma skill e proficiência já listadas antes: unificada numa linha só
//   removed -> cadastro incorreto conhecido (KNOWN_BAD_ENTRIES): removida na leitura
function annotateBlocks(campaignName, blocks) {
  const noDedup = NO_DEDUP_CAMPAIGNS.includes(campaignName);
  const seenPairs = new Set();
  const seenSkills = new Set();
  return blocks.map((block) => ({
    ...block,
    rows: block.rows.map((row) => {
      if (isKnownBadEntry(campaignName, row.skill)) return { ...row, status: 'removed' };
      const prof = row.pri === '-' || row.pri === '' ? '3' : row.pri;
      const pair = row.skill + '|' + prof;
      if (!noDedup && seenPairs.has(pair)) return { ...row, status: 'dup' };
      const status = seenSkills.has(row.skill) && !seenPairs.has(pair) ? 'both' : 'ok';
      seenPairs.add(pair);
      seenSkills.add(row.skill);
      return { ...row, status };
    }),
  }));
}

// Lê as linhas de uma aba sempre a partir da célula A1 (por padrão o SheetJS
// começa na primeira célula usada, o que deslocaria linha e coluna). Assim o
// índice de cada linha/coluna bate com a posição real no Excel e dá pra
// mostrar onde cada bloco fica. "anchored" diz se dá pra confiar nisso.
function applyHiddenCellsFilter(rows, sheet) {
  // Colunas e linhas ocultas no Excel (inclui linhas escondidas por filtro e
  // grupos recolhidos) são esvaziadas ANTES da leitura dos blocos — assim um
  // bloco oculto na matriz (ex.: EMP PURPLE - N1) também some da automação,
  // sem precisar listar nome por nome.
  const colsMeta = sheet['!cols'] || [];
  const rowsMeta = sheet['!rows'] || [];
  const hiddenCols = [];
  colsMeta.forEach((m, c) => {
    if (m && (m.hidden || m.wpx === 0 || m.wch === 0 || m.width === 0)) hiddenCols.push(c);
  });
  for (let r = 0; r < rows.length; r++) {
    const m = rowsMeta[r];
    if (m && m.hidden) { rows[r] = []; continue; }
    const row = rows[r];
    if (!row) continue;
    for (const c of hiddenCols) {
      if (c < row.length) row[c] = '';
    }
  }
  return rows;
}
function readSheetRows(XLSXlib, sheet) {
  const ref = sheet && sheet['!ref'];
  if (!ref) return { rows: [], anchored: true };
  const baseOpts = { header: 1, raw: false, defval: '' };
  try {
    const end = XLSXlib.utils.decode_range(ref).e;
    const rows = XLSXlib.utils.sheet_to_json(sheet, { ...baseOpts, range: 'A1:' + XLSXlib.utils.encode_cell(end) });
    const anchored = rows.length === end.r + 1;
    // só dá pra confiar nos índices de coluna/linha quando a leitura partiu do A1
    if (anchored) applyHiddenCellsFilter(rows, sheet);
    return { rows, anchored };
  } catch (err) {
    return { rows: XLSXlib.utils.sheet_to_json(sheet, baseOpts), anchored: false };
  }
}

// Núcleo da leitura da planilha, separado da tela pra poder ser testado de
// verdade. getSheetRows(nomeDaAba) devolve { rows, anchored }.
function buildMatrixFromWorkbook(sheetNames, getSheetRows) {
  const campaigns = {};
  const order = [];
  const summaries = [];
  let totalExcluded = 0;
  let hiddenSheetCount = 0;

  for (const sheetName of sheetNames) {
    // abas descontinuadas (nome com "OLD", ou substituídas por uma
    // versão com outro nome, tipo "... - NOVA") não entram em nada —
    // nem leitura, nem busca, nem painel de blocos
    if (/OLD/i.test(sheetName) || HIDDEN_SHEET_NAMES.includes(sheetName)) {
      hiddenSheetCount += 1;
      continue;
    }
    const { rows: sheetRows, anchored } = getSheetRows(sheetName);
    const parsed = parseMatrix(sheetRows);
    if (!anchored) {
      // não deu pra garantir a posição das células: o painel mostra o
      // bloco do mesmo jeito, só sem o "AD1:AF16"
      for (const list of Object.values(parsed.blocks)) {
        for (const b of list) b.col = -1;
      }
    }
    // troca o nome de exibição pras campanhas que precisam do aviso
    // "- OLD" antes de mais nada usar esses dados, pra tudo daqui pra
    // frente (painel de blocos, busca, resultado) já enxergar o nome
    // final
    const renamed = applyDisplayNameOverrides(
      sheetName,
      parsed.campaigns,
      parsed.order,
      parsed.collapsedCounts,
      parsed.keptBothSkills,
      parsed.blocks
    );
    // aplica a lista de exclusões conhecidas antes de mais nada usar
    // esses dados — assim o painel de blocos e o resultado final
    // já saem sem essas entradas, não importa a cópia da planilha
    const { cleaned: cleanedCampaigns, excludedCount } = applyKnownExclusions(renamed.campaigns);
    totalExcluded += excludedCount;
    const sheetOrder = renamed.order.filter((name) => cleanedCampaigns[name].length > 0);

    if (sheetOrder.length === 0) continue;

    summaries.push({
      sheetName,
      campaignNames: sheetOrder,
      campaigns: cleanedCampaigns,
      collapsedCounts: renamed.collapsedCounts,
      keptBothSkills: renamed.keptBothSkills,
    });

    for (const name of sheetOrder) {
      // cada aba mantém sua própria versão da campanha — nome repetido
      // em outra aba (ex.: "RETENÇÃO PME" no Huawei, no PME MÓVEL e no
      // rascunho "leandro") vira uma entrada nova, não um merge com o
      // que já foi lido; dentro da MESMA aba, se o nome já apareceu em
      // outra lane, aí sim continua somando (era o comportamento
      // original e faz sentido pra blocos repetidos lado a lado)
      const key = campaignKey(sheetName, name);
      if (!campaigns[key]) {
        campaigns[key] = [];
        order.push({
          key,
          name,
          sheetName,
          collapsedCount: renamed.collapsedCounts[name] || 0,
          keptBothCount: renamed.keptBothSkills[name] ? renamed.keptBothSkills[name].size : 0,
          // blocos crus da matriz (sem os vazios) pro painel "matriz de origem"
          blocks: (renamed.blocks[name] || []).filter((b) => b.rows.length > 0),
        });
      }
      for (const item of cleanedCampaigns[name]) {
        if (NO_DEDUP_CAMPAIGNS.includes(name) || !campaigns[key].some((s) => s.skill === item.skill && s.prof === item.prof)) {
          campaigns[key].push(item);
        }
      }
    }
  }

  const totalSkills = order.reduce((sum, c) => sum + campaigns[c.key].length, 0);

  // mapeia nome -> abas onde ele aparece, guardando só os que repetem;
  // é exatamente o cenário que causava a mistura (ex.: "RETENÇÃO PME"
  // em 3 abas diferentes) — mostrar isso de cara ajuda a perceber
  // rascunho/aba antiga esquecida na planilha antes de gerar qualquer coisa
  const nameSheets = {};
  for (const o of order) {
    if (!nameSheets[o.name]) nameSheets[o.name] = [];
    nameSheets[o.name].push(o.sheetName);
  }
  const dupes = {};
  for (const [name, sheets] of Object.entries(nameSheets)) {
    if (sheets.length > 1) dupes[name] = sheets;
  }

  return { campaigns, order, summaries, dupes, totalSkills, totalExcluded, hiddenSheetCount };
}
